services:

  postgres:
    image: postgis/postgis:16-3.5
    container_name: transitx-postgres
    environment:
      POSTGRES_DB: transitx
      POSTGRES_USER: transitx
      POSTGRES_PASSWORD: transitx_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitx -d transitx"]
      interval: 5s
  emqx:
    image: emqx/emqx:5.8.0
    environment:
      EMQX_ALLOW_ANONYMOUS: "true" # MVP only; require per-device credentials before deployment.
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion-worker:
    build: ../ingestion-worker
    environment:
      MQTT_BROKER: tcp://emqx:1883
      MQTT_TOPIC: gps/+/ping
      REDIS_ADDR: redis:6379
    depends_on:
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build: ../api-gateway
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
