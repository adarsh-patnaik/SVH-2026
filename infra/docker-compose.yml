services:

  postgres:
    image: postgis/postgis:16-3.5
    container_name: transitx-postgres
    environment:
      POSTGRES_DB: transitx
      POSTGRES_USER: transitx
      POSTGRES_PASSWORD: transitx_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitx -d transitx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: transitx-redis
    ports:
      - "6379:6379"

  emqx:
    image: emqx:5
    container_name: transitx-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"

volumes:
  postgres_data: